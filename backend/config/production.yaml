# 生产环境配置
# 环境: production
# 更新日期: 2026-03-07

# 应用配置
app:
  name: "Quant Research System"
  environment: "production"
  debug: false
  log_level: "INFO"

# 服务端口
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  timeout: 300
  keepalive: 65

# CORS 配置
cors:
  origins:
    - "https://quant.example.com"
    - "https://www.quant.example.com"
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "DELETE"]
  allow_headers: ["*"]

# DolphinDB 配置
database:
  host: "${DOLPHINDB_HOST}"
  port: 8848
  user: "${DOLPHINDB_USER}"
  password: "${DOLPHINDB_PASSWORD}"
  db_path: "dfs://quant"
  pool_size: 50
  timeout: 30
  retry_times: 3
  retry_delay: 2

# 数据采集配置
collector:
  tushare_token: "${TUSHARE_TOKEN}"
  calls_per_minute: 200
  retry_times: 3
  retry_delay: 2
  timeout: 30
  batch_size: 1000

# Prefect 配置
prefect:
  api_url: "${PREFECT_API_URL}"
  work_pool: "production-pool"
  concurrency_limit: 10

# 回测配置
backtest:
  initial_capital: 1000000.0
  commission_rate: 0.0003
  slippage_rate: 0.0001
  min_position_size: 0.01
  max_position_size: 0.2

# 机器学习配置
ml:
  n_trials: 200
  cv_folds: 5
  test_size: 0.2
  random_state: 42
  n_jobs: -1

# 数据同步配置
sync:
  default_start_date: "20100101"
  incremental_days: 1
  full_sync_interval: 7  # 天

# 因子计算配置
factor:
  lookback_days: 250
  min_periods: 20
  batch_size: 500
  parallel_workers: 4

# 缓存配置
cache:
  enabled: true
  ttl: 3600  # 秒
  max_size: 1000

# 日志配置
logging:
  level: "INFO"
  format: "json"
  rotation: "1 day"
  retention: "30 days"
  compression: "gz"

  # 日志文件路径
  files:
    app: "/var/log/quant/app.log"
    access: "/var/log/quant/access.log"
    error: "/var/log/quant/error.log"

  # 日志级别（按模块）
  modules:
    store: "INFO"
    engine: "INFO"
    data_manager: "INFO"
    app: "INFO"

# 监控配置
monitoring:
  enabled: true
  metrics_port: 9090
  health_check_interval: 30  # 秒

  # Prometheus
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"

  # 性能指标
  performance:
    slow_query_threshold: 5.0  # 秒
    slow_api_threshold: 1.0  # 秒

# 告警配置
alerting:
  enabled: true
  channels:
    - type: "email"
      recipients: ["ops@example.com"]
    - type: "webhook"
      url: "${ALERT_WEBHOOK_URL}"

  # 告警规则
  rules:
    error_rate:
      threshold: 0.01  # 1%
      window: 300  # 5分钟
    response_time:
      threshold: 5.0  # 秒
      percentile: 95
    memory_usage:
      threshold: 0.8  # 80%
    cpu_usage:
      threshold: 0.8  # 80%
    disk_usage:
      threshold: 0.85  # 85%

# 安全配置
security:
  # API 认证
  api_key_enabled: true
  jwt_enabled: true
  jwt_secret: "${JWT_SECRET}"
  jwt_expiration: 3600  # 秒

  # 速率限制
  rate_limit:
    enabled: true
    requests_per_minute: 1000
    burst: 100

  # IP 白名单
  ip_whitelist:
    enabled: false
    ips: []

# 性能优化
performance:
  # 连接池
  connection_pool:
    min_size: 10
    max_size: 50
    timeout: 30

  # 查询优化
  query:
    max_rows: 100000
    timeout: 30
    cache_enabled: true

  # 并发控制
  concurrency:
    max_workers: 8
    queue_size: 1000

# 备份配置
backup:
  enabled: true
  schedule: "0 2 * * *"  # 每天凌晨2点
  retention_days: 30
  path: "/data/backups"
  compress: true

# 功能开关
features:
  data_sync: true
  factor_calculation: true
  backtest: true
  ml_training: true
  api_docs: false  # 生产环境关闭 API 文档

# 资源限制
limits:
  max_request_size: 10485760  # 10MB
  max_response_size: 104857600  # 100MB
  max_concurrent_requests: 1000
  max_query_time: 300  # 秒
