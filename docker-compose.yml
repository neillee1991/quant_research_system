services:
  dolphindb:
    image: dolphindb/dolphindb:v3.00.5
    container_name: quant_dolphindb
    ports:
      - "8848:8848"
    volumes:
      - ${DOLPHINDB_DATA_DIR:-./data/dolphindb}:/data/ddb/server/data
    environment:
      TZ: Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - quant_network

  postgres:
    image: postgres:16-alpine
    container_name: quant_postgres
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: quantsystem
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quantsystem -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quant_network

networks:
  quant_network:
    driver: bridge

