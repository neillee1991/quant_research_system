# 备份脚本配置文件
# 用于 config/scripts/backup.sh

# 备份类型配置
BACKUP_TYPES=(
    "full"      # 完整备份
    "daily"     # 每日增量备份
    "weekly"    # 每周备份
    "monthly"   # 月备份
)

# 默认备份类型
DEFAULT_BACKUP_TYPE="daily"

# 备份保留策略
# 保留天数（单位：天）
BACKUP_RETENTION_DAYS=(
    ["daily"]=7
    ["weekly"]=30
    ["monthly"]=180
    ["full"]=365
)

# 备份文件存储位置
BACKUP_DIRECTORY="/Volumes/LiSh/data/backups"

# 临时工作目录
TEMP_DIRECTORY="/tmp/quant_backup"

# 压缩配置
COMPRESSION_ENABLED=true
COMPRESSION_LEVEL=6

# 备份文件前缀
BACKUP_PREFIX="quant_research_system"

# 文件权限
FILE_PERMISSIONS=640

# 目录权限
DIR_PERMISSIONS=750

# 用户/组
RUN_AS_USER="lisheng"
RUN_AS_GROUP="staff"

# 数据库配置
# DolphinDB 配置
DOLPHINDB_HOST="localhost"
DOLPHINDB_PORT=8848
DOLPHINDB_USER="admin"
DOLPHINDB_PASSWORD="123456"

# PostgreSQL 配置
POSTGRES_HOST="localhost"
POSTGRES_PORT=5432
POSTGRES_DB="quantsystem"
POSTGRES_USER="quant"
POSTGRES_PASSWORD="quant123"

# 备份策略
# 备份时间窗口（防止资源冲突）
BACKUP_TIME_WINDOW="02:00-06:00"

# 并发备份数
MAX_PARALLEL_BACKUPS=1

# 通知配置
# 成功时发送通知
NOTIFY_ON_SUCCESS=true

# 失败时发送通知
NOTIFY_ON_FAILURE=true

# 邮件配置（可选）
SMTP_SERVER="smtp.gmail.com"
SMTP_PORT=587
SMTP_USER=""
SMTP_PASSWORD=""
NOTIFY_TO="lisheng@example.com"
NOTIFY_FROM="backup@quant-research-system.com"

# 日志配置
LOG_LEVEL="INFO"
LOG_FILE="/Volumes/LiSh/data/logs/backup.log"
LOG_MAX_SIZE="100MB"
LOG_BACKUP_COUNT=5

# 健康检查配置
HEALTH_CHECK_INTERVAL=300
HEALTH_CHECK_TIMEOUT=60
HEALTH_CHECK_RETRY=3

# 紧急状态配置
# 磁盘空间告警阈值（百分比）
DISK_SPACE_THRESHOLD=80

# 文件系统类型白名单
ALLOWED_FILE_SYSTEMS=(
    "ext4"
    "apfs"
    "xfs"
)
